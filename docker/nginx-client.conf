server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index offline.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  include /etc/nginx/conf.d/offline.inc;

  location / {
    try_files $uri $uri/ /offline.html;
  }

  location ^~ /config/ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  location ~* \.(js|json|css|map)$ {
    try_files $uri =404;
  }

  # Heavy media (Pokémon sprites, trainer avatars, audio) is deliberately NOT
  # bundled in this image — upstream serves it from its CDN. Because our client
  # config overrides routes.client to this host (so it loads our *modded* JS/data
  # bundles), these requests land here. Serve any locally-bundled custom file
  # first, then fall back to upstream's CDN for everything else. This must live in
  # nginx (not Caddy): the `location /` fallback returns 200 offline.html
  # for misses, so an upstream proxy can't detect the 404 — try_files can.
  # Spaceworld '97 (gen2sw97) beta sprites live under sprites/gen2sw97/ so they never
  # override standard [Gen 2] art. Serve the local file first; on a miss, strip the
  # gen2sw97/ segment and fall back to the official gen2 sprite on the upstream CDN
  # (matches the modid dir-prefix in getSpriteData / getTeambuilderSpriteData). This
  # longer ^~ prefix wins over /sprites/ below for these URIs.
  location ^~ /sprites/gen2sw97/ {
    try_files $uri @ps_cdn_gen2sw97;
  }
  location ^~ /sprites/ {
    try_files $uri @ps_cdn;
  }
  location ^~ /audio/ {
    try_files $uri @ps_cdn;
  }

  location @ps_cdn {
    proxy_pass https://play.pokemonshowdown.com;
    proxy_set_header Host play.pokemonshowdown.com;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name play.pokemonshowdown.com;
    proxy_intercept_errors off;
  }

  location @ps_cdn_gen2sw97 {
    rewrite ^/sprites/gen2sw97/(.*)$ /sprites/$1 break;
    proxy_pass https://play.pokemonshowdown.com;
    proxy_set_header Host play.pokemonshowdown.com;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name play.pokemonshowdown.com;
    proxy_intercept_errors off;
  }
}

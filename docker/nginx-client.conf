server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index testclient-old.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    try_files $uri $uri/ /testclient-old.html;
  }

  location ^~ /config/ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  location ~* \.(js|json|css|map)$ {
    try_files $uri =404;
  }

  # Heavy media (Pokémon sprites, trainer avatars, audio) is deliberately NOT
  # bundled in this image — upstream serves it from its CDN. Because our client
  # config overrides routes.client to this host (so it loads our *modded* JS/data
  # bundles), these requests land here. Serve any locally-bundled custom file
  # first, then fall back to upstream's CDN for everything else. This must live in
  # nginx (not Caddy): the `location /` fallback returns 200 testclient-old.html
  # for misses, so an upstream proxy can't detect the 404 — try_files can.
  location ^~ /sprites/ {
    try_files $uri @ps_cdn;
  }
  location ^~ /audio/ {
    try_files $uri @ps_cdn;
  }

  location @ps_cdn {
    proxy_pass https://play.pokemonshowdown.com;
    proxy_set_header Host play.pokemonshowdown.com;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name play.pokemonshowdown.com;
    proxy_intercept_errors off;
  }
}
